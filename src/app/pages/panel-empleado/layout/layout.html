<div class="app-container">
  <!-- Sidebar -->
  <aside class="sidebar" [class.collapsed]="isCollapsed">
    <div class="sidebar-header">
      <span class="logo">SISTEMA ALMACÉN</span>
      <button class="toggle-btn" (click)="toggleSidebar()">
        <svg style="width:24px;height:24px" viewBox="0 0 24 24"><path fill="currentColor" d="M3,6H21V8H3V6M3,11H21V13H3V11M3,16H21V18H3V16Z"/></svg>
      </button>
    </div>

    <ul class="nav-links">
      <li class="nav-item">
        <a routerLink="/empleado/productos" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 3H5C3.9 3 3 3.9 3 5V19C3 20.1 3.9 21 5 21H19C20.1 21 21 20.1 21 19V5C21 3.9 20.1 3 19 3M19 19H5V5H19V19M8 17H16V15H8V17M8 13H16V11H8V13M8 9H16V7H8V9Z"/></svg>
          <span class="nav-text">Productos</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/empleado/categorias" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M10,4V8H14V4H10M11,5H13V7H11V5M16,4V8H20V4H16M17,5H19V7H17V5M4,10V14H8V10H4M5,11H7V13H5V11M10,10V14H14V10H10M11,11H13V13H11V11M16,10V14H20V10H16M17,11H19V13H17V11M4,16V20H8V16H4M5,17H7V19H5V17M10,16V20H14V16H10M11,17H13V19H11V17Z"/></svg>
          <span class="nav-text">Categorías</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/empleado/inventario" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M14 2H6C4.9 2 4 2.9 4 4V20C4 21.1 4.9 22 6 22H18C19.1 22 20 21.1 20 20V8L14 2M18 20H6V4H13V9H18V20M12 11L16 15H13V18H11V15H8L12 11Z"/></svg>
          <span class="nav-text">Inventario</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/empleado/movimientos" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19 13H5V11H19V13M12 5L19 12L12 19L10.59 17.59L15.17 13H5V11H15.17L10.59 6.41L12 5Z"/></svg>
          <span class="nav-text">Movimientos</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/empleado/solicitudes" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M19,3H5A2,2 0 0,0 3,5V19A2,2 0 0,0 5,21H19A2,2 0 0,0 21,19V5A2,2 0 0,0 19,3M19,19H5V5H19V19M11,7H13V13H11V7M11,15H13V17H11V15Z"/></svg>
          <span class="nav-text">Mis Solicitudes</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/empleado/notificaciones" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M11,7H13V13H11V7M11,15H13V17H11V15Z"/></svg>
          <span class="nav-text">Notificaciones</span>
        </a>
      </li>
      <li class="nav-item">
        <a routerLink="/empleado/perfil" routerLinkActive="active">
          <svg class="nav-icon" viewBox="0 0 24 24"><path fill="currentColor" d="M12,4A4,4 0 0,1 16,8A4,4 0 0,1 12,12A4,4 0 0,1 8,8A4,4 0 0,1 12,4M12,14C16.42,14 20,15.79 20,18V20H4V18C4,15.79 7.58,14 12,14Z"/></svg>
          <span class="nav-text">Mi Perfil</span>
        </a>
      </li>
    </ul>

    <div class="sidebar-footer">
      <div class="user-badge">
        <div class="avatar">{{ initials }}</div>
        <div class="user-info">
          <span class="user-name">{{ userName }}</span>
          <span class="user-role">EMPLEADO</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="main-content">
    <!-- Header -->
    <header class="top-header">
      <div class="header-title">Panel Operativo de Almacén</div>
      <div class="header-right">
        <!-- Notificaciones de Alerta Rápida -->
        <button class="notification-badge" routerLink="/empleado/notificaciones">
          <svg style="width:24px;height:24px" viewBox="0 0 24 24"><path fill="currentColor" d="M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M12,20A8,8 0 0,1 4,12A8,8 0 0,1 12,4A8,8 0 0,1 20,12A8,8 0 0,1 12,20M11,7H13V13H11V7M11,15H13V17H11V15Z"/></svg>
          @if (unreadCount > 0) {
            <span class="badge-dot"></span>
          }
        </button>

        <button class="btn-logout-header" (click)="logout()">
          Cerrar Sesión
        </button>
      </div>
    </header>

    <!-- Content body -->
    <main class="content-body">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="footer">
      &copy; 2026 Sistema de Gestión de Almacén SaaS. Área Operativa.
    </footer>
  </div>
</div>
